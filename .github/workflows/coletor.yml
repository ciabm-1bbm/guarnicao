# ============================================================================
#  Roda o coletor automaticamente nos servidores do GitHub, sem PC ligado.
# ============================================================================
name: Coletor E193

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos
  workflow_dispatch:         # botão "Run workflow" para testar na mão

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache do navegador (deixa as próximas execuções mais rápidas)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Instalar dependências
        run: npm install

      - name: Instalar o navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar o coletor
        env:
          E193_USER: ${{ secrets.E193_USER }}
          E193_PASS: ${{ secrets.E193_PASS }}
          URL_PONTE: ${{ secrets.URL_PONTE }}
        run: node poa.js

      # Se der erro, guarda a foto da tela e o HTML para podermos ver o que houve.
      - name: Salvar diagnóstico (foto e HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: |
            erro.png
            erro.html
          if-no-files-found: ignore
